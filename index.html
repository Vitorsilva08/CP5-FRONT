<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Grão Nobre</title>
</head>
<body>
    <main id="inicio">
        <header class="menu">
            <div class="logo">
                Grão<span>Nobre</span>
            </div>
            <div class="menu-direita">
                <nav>
                    <a href="#inicio">Início</a>
                    <a href="#Depoimentos">Depoimentos</a>
                    <a href="#FAQ">FAQ</a>
                </nav>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    Comprar Agora
                </button>
            </div>
        </header>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Pedido</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <ul>
                            Kit de Degustação:
                            <li>1 pacote de 250g</li>
                            <li>5 pacotes de 250g</li>
                        </ul>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary">Adicionar ao Carrinho</button>
                    </div>
                </div>
            </div>
        </div>
        <section class="conteudo">
            <div class="conteudo-tit">
                <h2>Café de origem,<br>torrado com propósito.</h2>
                <div class="conteudo-text">
                    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Hic quibusdam eum nihil ea expedita impedit beatae eius voluptatum totam enim.</p>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
